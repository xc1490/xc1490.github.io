const b=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));
async function keyFrom(pw){const k=await crypto.subtle.importKey("raw",new TextEncoder().encode(pw),"PBKDF2",false,["deriveKey"]);
 return crypto.subtle.deriveKey({name:"PBKDF2",salt:b(P.salt),iterations:P.it,hash:"SHA-256"},k,{name:"AES-GCM",length:256},true,["decrypt"]);}
async function plain(key){const pt=await crypto.subtle.decrypt({name:"AES-GCM",iv:b(P.iv)},key,b(P.ct));return new TextDecoder().decode(pt);}
async function show(h){if(document.readyState!=="complete")await new Promise(r=>addEventListener("load",r,{once:true}));document.open();document.write(h);document.close();}
(async()=>{const raw=localStorage.getItem("xr-k-ccbd-deck");if(!raw)return;try{const k=await crypto.subtle.importKey("raw",b(raw),"AES-GCM",true,["decrypt"]);await show(await plain(k));}catch(e){localStorage.removeItem("xr-k-ccbd-deck");document.documentElement.style.visibility="visible"}})();
document.getElementById("g").addEventListener("submit",async ev=>{ev.preventDefault();const e=document.getElementById("e");e.textContent="";
 let h;try{const k=await keyFrom(document.getElementById("pw").value);h=await plain(k);
  const r=new Uint8Array(await crypto.subtle.exportKey("raw",k));localStorage.setItem("xr-k-ccbd-deck",btoa(String.fromCharCode(...r)));}
 catch(x){e.textContent="Incorrect code. 访问码不正确，请重试。";return;}
 show(h);});
